<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Moneybird Invoice Creator Settings</title>
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
    <style>
        .error {
            color: #ff0000;
            font-size: 12px;
            margin-top: 4px;
        }
        .hidden {
            display: none;
        }
        .warning {
            color: #ffb000;
            font-size: 12px;
            margin-top: 4px;
        }
        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <sdpi-item label="Display title">
        <sdpi-textfield id="displayTitle" setting="displayTitle" placeholder="Title of the key"></sdpi-textfield>
    </sdpi-item>

    <!-- Shared by every key. No setting attribute: the plugin stores it in its global
         settings once Moneybird accepted it, never in the settings of this key. -->
    <sdpi-item label="API Key">
        <sdpi-textfield id="globalApiKey" type="password" placeholder="Shared by all keys"></sdpi-textfield>
        <div id="globalApiKeyError" class="error hidden"></div>
    </sdpi-item>

    <sdpi-item label="Own API Key">
        <sdpi-checkbox id="apiKeyIsOverride" setting="apiKeyIsOverride" label="Use a different API key for this key"></sdpi-checkbox>
    </sdpi-item>

    <sdpi-item id="ownApiKeyItem" label="Key for this key" class="hidden">
        <sdpi-textfield id="apiKey" setting="apiKey" type="password" placeholder="For another Moneybird account"></sdpi-textfield>
        <div id="apiKeyError" class="error hidden"></div>
    </sdpi-item>

    <sdpi-item label="Administration">
        <sdpi-select id="administrationId" setting="administrationId">
            <option value="">Select an administration</option>
        </sdpi-select>
        <div id="administrationError" class="error hidden"></div>
    </sdpi-item>

    <sdpi-item label="Contact">
        <sdpi-select id="contactId" setting="contactId">
            <option value="">Select a contact</option>
        </sdpi-select>
        <div id="contactError" class="error hidden"></div>
    </sdpi-item>

    <sdpi-item label="Period Type">
        <sdpi-select id="periodType" setting="periodType">
            <option value="month">Month</option>
            <option value="quarter">Quarter</option>
            <option value="year">Year</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Period Range">
        <sdpi-select id="periodRange" setting="periodRange">
            <option value="current">This</option>
            <option value="last">Last</option>
        </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Hourly Rate (€)">
        <sdpi-textfield id="hourlyRate" setting="hourlyRate" type="text" placeholder="75" pattern="[0-9]+([.,][0-9]+)?"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Description">
        <sdpi-textfield id="description" setting="description" placeholder="Invoice description"></sdpi-textfield>
    </sdpi-item>

    <script>
    (function() {
        'use strict';
        
        const { streamDeckClient } = SDPIComponents;
        let isConnected = false;
        let currentSettings = {};
        let isLoading = false;
        let administrationsRequested = false;
        let ownApiKeyEnabled = false;
        let actionContext = null;

        function setLoading(loading) {
            isLoading = loading;
            const selects = document.querySelectorAll('sdpi-select');
            selects.forEach(select => {
                if (loading) {
                    select.classList.add('loading');
                } else {
                    select.classList.remove('loading');
                }
            });
        }

        function showError(elementId, message) {
            const errorDiv = document.getElementById(`${elementId}Error`);
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
            }
        }

        function hideError(elementId) {
            const errorDiv = document.getElementById(`${elementId}Error`);
            if (errorDiv) {
                errorDiv.classList.add('hidden');
            }
        }

        function updateFormFields(settings = {}) {
            try {
                const relevantKeys = ['apiKey', 'displayTitle', 'administrationId', 'contactId', 'periodType', 'periodRange', 'description', 'hourlyRate'];
                
                // Handle backwards compatibility - convert old period to new format
                if (settings.period && !settings.periodType) {
                    const periodMap = {
                        'current_month': { type: 'month', range: 'current' },
                        'last_month': { type: 'month', range: 'last' },
                        'current_quarter': { type: 'quarter', range: 'current' },
                        'last_quarter': { type: 'quarter', range: 'last' },
                        'current_year': { type: 'year', range: 'current' }
                    };
                    
                    const mapped = periodMap[settings.period];
                    if (mapped) {
                        settings.periodType = mapped.type;
                        settings.periodRange = mapped.range;
                    }
                }
                
                relevantKeys.forEach(key => {
                    const value = settings[key];
                    if (value !== undefined) {
                        try {
                            const element = document.getElementById(key);
                            if (element) {
                                element.value = value?.toString() || '';
                                hideError(key);
                            }
                        } catch (fieldError) {
                            showError(key, 'Error updating field');
                        }
                    }
                });
                
                // Set defaults if not set
                const periodTypeElement = document.getElementById('periodType');
                if (periodTypeElement && !settings.periodType) {
                    periodTypeElement.value = 'month';
                }
                
                const periodRangeElement = document.getElementById('periodRange');
                if (periodRangeElement && !settings.periodRange) {
                    periodRangeElement.value = 'current';
                }
                
                const hourlyRateElement = document.getElementById('hourlyRate');
                if (hourlyRateElement && (!settings.hourlyRate || settings.hourlyRate === '')) {
                    hourlyRateElement.value = '75';
                    hourlyRateElement.placeholder = '75';
                }
            } catch (error) {
                console.error('Error updating form fields:', error);
            }
        }

        // Names come from Moneybird (contacts, projects, users). Escape them before they are
        // put into innerHTML, so a name like <img onerror=...> renders as text, not markup.
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function updateDropdown(elementId, items = {}, valueKey = 'id', nameKey = 'name', defaultText = 'Select an option') {
            try {
                const select = document.getElementById(elementId);
                if (!select) return;

                const options = [{ value: '', text: defaultText }];
                
                if (Array.isArray(items)) {
                    items.forEach(item => {
                        if (item?.[valueKey]) {
                            let displayName = item[nameKey] || '';
                            
                            if (displayName) {
                                options.push({
                                    value: item[valueKey],
                                    text: displayName
                                });
                            }
                        }
                    });
                } else if (typeof items === 'object') {
                    Object.entries(items).forEach(([key, item]) => {
                        if (item?.[valueKey]) {
                            let displayName = item[nameKey] || '';
                            
                            if (displayName) {
                                options.push({
                                    value: item[valueKey],
                                    text: displayName
                                });
                            }
                        }
                    });
                }

                const optionsHtml = options.map(opt => 
                    `<option value="${escapeHtml(opt.value)}">${escapeHtml(opt.text)}</option>`
                ).join('');

                select.innerHTML = optionsHtml;

                // Restore saved value if exists
                if (currentSettings[select.getAttribute('setting')]) {
                    select.value = currentSettings[select.getAttribute('setting')];
                }

                hideError(elementId);
            } catch (error) {
                showError(elementId, `Error loading ${elementId}`);
            }
        }

        // scope 'global' edits the key shared by all keys, scope 'key' this key's own key.
        // The plugin checks the key with Moneybird before it stores it, and answers with
        // apiKeyAccepted or apiKeyRejected.
        async function sendApiKeyChange(scope, apiKey) {
            const fieldId = scope === 'global' ? 'globalApiKey' : 'apiKey';
            setLoading(true);
            try {
                await streamDeckClient.send('sendToPlugin', {
                    event: 'apiKeyChanged',
                    scope: scope,
                    apiKey: apiKey
                });
            } catch (error) {
                showError(fieldId, 'Error loading administrations');
            } finally {
                setLoading(false);
            }
        }

        async function requestAdministrations() {
            try {
                await streamDeckClient.send('sendToPlugin', { event: 'loadAdministrations' });
            } catch (error) {
                showError('administrationId', 'Error loading administrations');
            }
        }

        async function loadGlobalApiKey() {
            try {
                const globalSettings = await streamDeckClient.getGlobalSettings();
                const field = document.getElementById('globalApiKey');
                if (field) {
                    field.value = globalSettings?.apiKey || '';
                }
            } catch (error) {
                showError('globalApiKey', 'Error loading the shared API key');
            }
        }

        function syncApiKeyFields(settings) {
            ownApiKeyEnabled = settings.apiKeyIsOverride === true;
            const checkbox = document.getElementById('apiKeyIsOverride');
            // Only assign a real change: every assignment makes the component save settings.
            if (checkbox && Boolean(checkbox.value) !== ownApiKeyEnabled) {
                checkbox.value = ownApiKeyEnabled;
            }
            document.getElementById('ownApiKeyItem')?.classList.toggle('hidden', !ownApiKeyEnabled);
            const ownField = document.getElementById('apiKey');
            if (ownField && !ownApiKeyEnabled && !settings.apiKey && ownField.value) {
                ownField.value = '';
            }

            const warning = document.getElementById('runningKeyWarning');
            if (warning) {
                warning.classList.toggle('hidden', settings.isRunning !== true);
            }
        }

        async function loadAdministrationData(administrationId) {
            if (!administrationId) {
                // Clear dropdowns
                await updateDropdown('contactId', {}, 'id', 'company_name', 'Select a contact');
                return;
            }

            setLoading(true);
            try {
                // Set loading state for dropdowns
                await updateDropdown('contactId', {}, 'id', 'company_name', 'Loading contacts...');
                
                // Request data from plugin
                await streamDeckClient.send('sendToPlugin', {
                    event: 'administrationSelected',
                    administrationId: administrationId
                });
            } catch (error) {
                showError('administrationId', 'Error loading administration data');
            } finally {
                setLoading(false);
            }
        }

        async function saveSettings() {
            if (!isConnected) return;

            const settings = {};
            const elements = document.querySelectorAll('[setting]');
            
            elements.forEach(element => {
                const settingName = element.getAttribute('setting');
                
                if (settingName) {
                    settings[settingName] = element.value || '';
                }
            });

            await streamDeckClient.setSettings(settings);
            currentSettings = {...currentSettings, ...settings};
        }

        function initializeEventListeners() {
            try {
                // Listen for all setting changes
                const settingElements = document.querySelectorAll('[setting]');
                settingElements.forEach(element => {
                    // Use both input and change events for better compatibility
                    element.addEventListener('input', saveSettings);
                    element.addEventListener('change', saveSettings);
                });

                // API key inputs - check the key with Moneybird and load administrations
                const watchApiKey = (elementId, scope) => {
                    const element = document.getElementById(elementId);
                    if (!element) return;
                    let apiKeyTimeout;
                    element.addEventListener('input', (e) => {
                        clearTimeout(apiKeyTimeout);
                        hideError(elementId);
                        apiKeyTimeout = setTimeout(() => {
                            const value = e.target.value?.trim() || '';
                            // An emptied shared key is ignored; an emptied own key falls
                            // back to the shared key.
                            if (value || scope === 'key') {
                                sendApiKeyChange(scope, value);
                            }
                        }, 500); // Debounce API calls
                    });
                };
                watchApiKey('globalApiKey', 'global');
                watchApiKey('apiKey', 'key');

                // Own API key checkbox. The value is read after the event, once the
                // component has updated it; both events may fire for one click.
                const overrideElement = document.getElementById('apiKeyIsOverride');
                if (overrideElement) {
                    const onOverrideToggle = () => setTimeout(() => {
                        const enabled = overrideElement.value === true || overrideElement.value === 'true';
                        if (enabled === ownApiKeyEnabled) return;
                        ownApiKeyEnabled = enabled;
                        document.getElementById('ownApiKeyItem')?.classList.toggle('hidden', !enabled);
                        if (!enabled) {
                            // The plugin removes the own key (or refuses while a timer runs
                            // that the shared key cannot reach). The field is cleared once
                            // the plugin's settings arrive, not here: the component would
                            // save the empty value right away.
                            hideError('apiKey');
                            sendApiKeyChange('key', '');
                        }
                    }, 0);
                    overrideElement.addEventListener('input', onOverrideToggle);
                    overrideElement.addEventListener('change', onOverrideToggle);
                }

                // Administration select - load contacts
                const adminElement = document.getElementById('administrationId');
                if (adminElement) {
                    let lastValue = adminElement.value;
                    
                    // Function to handle administration changes
                    const handleAdminChange = (newValue) => {
                        if (newValue !== lastValue) {
                            lastValue = newValue;
                            loadAdministrationData(newValue);
                        }
                    };
                    
                    // Listen to standard events
                    adminElement.addEventListener('change', (e) => handleAdminChange(e.target.value));
                    adminElement.addEventListener('input', (e) => handleAdminChange(e.target.value));
                    
                    // Also use MutationObserver to catch programmatic changes
                    const observer = new MutationObserver((mutations) => {
                        mutations.forEach((mutation) => {
                            if (mutation.type === 'attributes' && mutation.attributeName === 'value') {
                                handleAdminChange(adminElement.value);
                            }
                        });
                    });
                    
                    // Start observing
                    observer.observe(adminElement, {
                        attributes: true,
                        attributeFilter: ['value']
                    });
                    
                    // Also poll for changes as a fallback
                    setInterval(() => {
                        if (adminElement.value !== lastValue) {
                            handleAdminChange(adminElement.value);
                        }
                    }, 250);
                }
            } catch (error) {
                console.error('Error initializing event listeners:', error);
            }
        }

        streamDeckClient.didReceiveSettings.subscribe(async event => {
            try {
                const settings = event?.payload?.settings || {};
                
                currentSettings = settings;
                
                // Update form fields
                updateFormFields(settings);
                syncApiKeyFields(settings);

                // A new key, or one whose lists were never loaded: load them with the
                // shared key (or this key's own key). Once per opened property inspector.
                const hasAdministrations = settings.administrations
                    && typeof settings.administrations === 'object'
                    && Object.keys(settings.administrations).length > 0;
                if (!hasAdministrations && !administrationsRequested) {
                    administrationsRequested = true;
                    requestAdministrations();
                }
                
                // Update administrations dropdown if we have them
                if (settings.administrations && typeof settings.administrations === 'object') {
                    await updateDropdown('administrationId', settings.administrations);
                    
                    // Force trigger change if we have a selected administration
                    if (settings.administrationId) {
                        const adminElement = document.getElementById('administrationId');
                        if (adminElement) {
                            // Set the value again to ensure it's selected
                            adminElement.value = settings.administrationId;
                            
                            // If this is a new administration selection (no contacts loaded yet), load the data
                            if (!settings.contacts || Object.keys(settings.contacts).length === 0) {
                                setTimeout(() => {
                                    loadAdministrationData(settings.administrationId);
                                }, 200);
                            }
                        }
                    }
                }

                // Update contacts dropdown if we have the data
                if (settings.contacts && typeof settings.contacts === 'object') {
                    await updateDropdown('contactId', settings.contacts, 'id', 'company_name', 'Select a contact');
                }
            } catch (error) {
                console.error('Error in didReceiveSettings:', error);
            }
        });

        // Answers from the plugin about an API key change.
        streamDeckClient.sendToPropertyInspector.subscribe(event => {
            const message = event?.payload || {};
            // An answer that arrives after switching to another key belongs to that key.
            if (message.actionId && actionContext && message.actionId !== actionContext) {
                return;
            }
            const fieldId = message.scope === 'key' ? 'apiKey' : 'globalApiKey';
            if (message.event === 'apiKeyRejected') {
                if (message.scope === 'key') {
                    // Show the own key again, also after a refused untick.
                    const ownField = document.getElementById('apiKey');
                    if (ownField?.value && !ownApiKeyEnabled) {
                        ownApiKeyEnabled = true;
                        const checkbox = document.getElementById('apiKeyIsOverride');
                        if (checkbox) checkbox.value = true;
                    }
                    document.getElementById('ownApiKeyItem')?.classList.remove('hidden');
                }
                showError(fieldId, message.message || 'Moneybird rejected this API key');
            } else if (message.event === 'apiKeyAccepted') {
                hideError(fieldId);
            }
        });

        window.connectElgatoStreamDeckSocket = async function(port, uuid, event, info, actionInfo) {
            try {
                const parsedActionInfo = JSON.parse(actionInfo);
                actionContext = parsedActionInfo?.context || null;
                await streamDeckClient.connect(port, uuid, event, JSON.parse(info), parsedActionInfo);
                
                isConnected = true;
                
                initializeEventListeners();
                await loadGlobalApiKey();
                
            } catch (error) {
                console.error('Error connecting to Stream Deck:', error);
            }
        };
    })();
    </script>
</body>
</html>
